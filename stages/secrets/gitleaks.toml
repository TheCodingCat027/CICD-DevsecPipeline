# Gitleaks configuration for DevSecOps pipeline - P2/secrets stage
# Extends the built-in ruleset with custom rules for Flask apps

[extend]
useDefault = true

[[rules]]
id = "aws-access-key"
description = "AWS Access Key"
regex = '''AKIA[0-9A-Z]{16}'''
tags = ["key", "AWS"]
keywords = ["AKIA"]

[[rules]]
id = "flask-secret-key"
description = "Flask SECRET_KEY hardcoded in source"
regex = '''(?i)SECRET_KEY\s*=\s*["'][^"']{8,}["']'''
tags = ["secret", "flask"]

[[rules]]
id = "hardcoded-password"
description = "Hardcoded password in variable assignment"
regex = '''(?i)(password|passwd|pwd)\s*=\s*["'][^"']{4,}["']'''
tags = ["secret", "password"]

[allowlist]
description = "Safe paths that should not trigger secret alerts"
paths = [
  '''.env.example''',
  '''tests/fixtures/''',
  '''tests/run_test.sh''',
  '''seeded-vulnerabilities''',
]
